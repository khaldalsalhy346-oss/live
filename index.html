<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saflive - البث المباشر ونظام النقاط</title>
    <!-- استيراد الخطوط والتصميم العصري -->
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .points-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid var(--accent);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .stream-box {
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .stream-placeholder {
            color: var(--text-secondary);
            font-size: 16px;
            text-align: center;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-color);
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        button.secondary {
            background: #334155;
        }

        button.secondary:hover {
            background: #475569;
        }

        .leaderboard-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #334155;
            font-size: 15px;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 13px;
            color: var(--accent);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Saflive 🔴</div>
        <div class="points-badge">النقاط: <span id="userPoints">0</span> ⭐</div>
    </header>

    <div class="container">
        <!-- قسم البث المباشر -->
        <div class="card">
            <h2>مشاهدة البث المباشر</h2>
            <div class="stream-box">
                <div class="stream-placeholder">البث غير متصل حالياً<br><small>سيظهر البث هنا عند البدء</small></div>
            </div>
            <div class="controls">
                <button onclick="addPoints(10)">اضسغط لاكتساب نقاط (+) ⭐</button>
            </div>
            <div id="status" class="status-msg"></div>
        </div>

        <!-- منظومة النقاط ولوحة الصدارة -->
        <div class="card">
            <h2>لوحة المتصدرين</h2>
            <ul class="leaderboard-list" id="leaderboard">
                <li class="leaderboard-item"><span>جاري تحميل البيانات...</span><span>-</span></li>
            </ul>
        </div>
    </div>

    <!-- ربط Firebase وقاعدة البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعدادات مشروعك الجديد على Firebase (saflive)
        const firebaseConfig = {
          apiKey: "AIzaSyBLzmAcwFMcP7m6yjd_25MTKX1DPZJz958",
          authDomain: "saflive.firebaseapp.com",
          databaseURL: "https://saflive-default-rtdb.firebaseio.com",
          projectId: "saflive",
          storageBucket: "saflive.appspot.com",
          messagingSenderId: "58101936676",
          appId: "1:58101936676:web:becc0daad1b39668351eb1",
          measurementId: "G-27J67DR2WE"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // تعريف مستخدم افتراضي للتجربة (يمكنك تعديل الاسم لاحقاً)
        const userId = "user_" + Math.floor(Math.random() * 1000);
        const userName = "المشاهد " + Math.floor(Math.random() * 100);

        // مرجع نقاط المستخدم في قاعدة البيانات
        const userRef = ref(db, 'users/' + userId);

        // تحديث النقاط عند التفاعل
        window.addPoints = function(amount) {
            update(userRef, {
                name: userName,
                points: increment(amount)
            }).then(() => {
                document.getElementById('status').innerText = `تم إضافة ${amount} نقاط بنجاح!`;
                setTimeout(() => document.getElementById('status').innerText = '', 2000);
            });
        };

        // قراءة النقاط الخاصة بالمستخدم بشكل مباشر
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.points) {
                document.getElementById('userPoints').innerText = data.points;
            }
        });

        // جلب قائمة المتصدرين وتحديثها لحظياً من Realtime Database
        const allUsersRef = ref(db, 'users');
        onValue(allUsersRef, (snapshot) => {
            const users = snapshot.val();
            const listEl = document.getElementById('leaderboard');
            listEl.innerHTML = '';

            if (users) {
                // ترتيب المستخدمين تنازلياً حسب النقاط
                const sortedUsers = Object.values(users).sort((a, b) => b.points - a.points);
                
                sortedUsers.forEach((user, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `<span>${index + 1}. ${user.name}</span> <strong>${user.points} نقطة</strong>`;
                    listEl.appendChild(li);
                });
            } else {
                listEl.innerHTML = '<li class="leaderboard-item"><span>لا توجد بيانات بعد</span><span>0</span></li>';
            }
        });
    </script>
</body>
</html>
