<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سفوان سبورت - بث مباشر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #111827; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1f2937; padding: 20px; border-radius: 12px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; }
        input { background: #374151; color: #fff; }
        button { background: #22c55e; color: #fff; font-weight: bold; cursor: pointer; }
        .stream-card { background: #374151; padding: 15px; margin: 10px 0; border-radius: 8px; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <h2>سفوان سبورت</h2>
        <input type="text" id="title" placeholder="اسم المباراة">
        <input type="url" id="url" placeholder="رابط البث">
        <button onclick="saveStream()">نشر البث للجميع</button>
        <div id="list">جاري تحميل البثوث...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEkSuSenS9DtkEtIIKZY5xVkjVHPrgNuM",
            authDomain: "mowakebapp-b4c7d.firebaseapp.com",
            databaseURL: "https://mowakebapp-b4c7d-default-rtdb.firebaseio.com",
            projectId: "mowakebapp-b4c7d",
            storageBucket: "mowakebapp-b4c7d.appspot.com",
            messagingSenderId: "647151214709",
            appId: "1:647151214709:web:6c387f0cf2f8087700583c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.saveStream = () => {
            const title = document.getElementById('title').value;
            const url = document.getElementById('url').value;
            if(title && url) {
                push(ref(db, 'streams'), { title, url });
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
            }
        };

        onValue(ref(db, 'streams'), (snapshot) => {
            const list = document.getElementById('list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const s = child.val();
                list.innerHTML += `<div class="stream-card"><h3>${s.title}</h3><a href="${s.url}" target="_blank" style="color:#38bdf8">مشاهدة البث</a></div>`;
            });
        });
    </script>
</body>
</html>
